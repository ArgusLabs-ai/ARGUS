name: downloads

# Daily: merge pypistats' 180-day window into the ledger on the `stats` branch,
# redraw the README chart and the downloads badge.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: stats
          path: stats
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/downloads_chart.py stats
      - name: Commit
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json downloads.svg downloads-badge.json
          git diff --cached --quiet || { git commit -m "chore: update download stats" && git push; }
