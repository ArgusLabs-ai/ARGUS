name: CI

on:
  push:
    branches: [main, master, dev, "pivot/**"]
  pull_request:
    branches: [main, master, dev, "pivot/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
        # The recorder needs langgraph 0.6+ (pyproject floor). Test the floor
        # and the current major. 1.x requires Python 3.10+, so 3.9 gets 0.6 only.
        langgraph: ["~=0.6.0", ">=1,<2"]
        exclude:
          - python-version: "3.9"
            langgraph: ">=1,<2"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" "langgraph${{ matrix.langgraph }}"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --tb=short

      # Eat our own cooking (#56) through the Action users get (#57): if
      # pytest --argus regresses, this job goes red. Narrow gate only — the
      # suite's intentional silent-failure tests would fail an outer --argus.
      - name: Test pytest --argus gate (the published Action)
        uses: ./.github/actions/argus-gate
        with:
          install: "false"
          pytest-args: tests/test_argus_ci_gate.py --tb=short

      # A gate that passes everything is worse than none: record a run that
      # fails silently and require the Action to fail it.
      - name: Record a silently failing run
        id: silent
        run: |
          python - <<'PY'
          import os
          from typing import TypedDict

          from langgraph.graph import END, START, StateGraph

          from argus import ArgusRecorder


          class S(TypedDict, total=False):
              query: str
              docs: list


          g = StateGraph(S)
          g.add_node("search", lambda s: {})  # the silent no-op
          g.add_node("answer", lambda s: {"query": s["query"]})
          g.add_edge(START, "search")
          g.add_edge("search", "answer")
          g.add_edge("answer", END)
          rec = ArgusRecorder(semantic_judge=False)
          rec.attach(g.compile()).invoke({"query": "refunds"})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run_id={rec.session.run_id}\n")
          PY

      - name: Grade that run with the Action
        id: gate
        continue-on-error: true
        uses: ./.github/actions/argus-gate
        with:
          install: "false"
          run-id: ${{ steps.silent.outputs.run_id }}

      - name: The Action must have failed it
        if: steps.gate.outcome != 'failure'
        run: |
          echo "::error::The ARGUS Action passed run ${{ steps.silent.outputs.run_id }}, which has a silent failure."
          exit 1

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: No colour literals
        run: npm run check:literals

      - name: Build
        run: npm run build

  dist-freshness:
    # `argus ui` serves the committed src/argus/ui_dist/, so a UI change that
    # does not rebuild it ships the previous dashboard. This is a git check, not
    # a rebuild-and-diff: chunk filenames carry content hashes that differ across
    # Node versions, which would make a diff gate fail on every PR.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ui_dist must be rebuilt when the dashboard source changes
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          source_changed=$(echo "$changed" | grep -E '^website/(app|components|lib|public)/|^website/(next\.config\.mjs|tailwind\.config\.ts|postcss\.config\.[mc]?js|package(-lock)?\.json|tsconfig\.json)$' || true)
          dist_changed=$(echo "$changed" | grep '^src/argus/ui_dist/' || true)
          if [ -n "$source_changed" ] && [ -z "$dist_changed" ]; then
            echo "::error::website/ source changed but src/argus/ui_dist/ was not rebuilt."
            echo "Run: bash scripts/build_ui.sh && git add src/argus/ui_dist"
            exit 1
          fi
          echo "ui_dist is in step with the dashboard source."
