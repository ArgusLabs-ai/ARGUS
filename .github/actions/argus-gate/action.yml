name: ARGUS CI gate
description: >-
  Fail the job when an agent pipeline run was not clean (silent failure, crash,
  semantic failure), by grading your tests with `pytest --argus` or one saved run
  with `argus check`.
author: ArgusLabs-ai
branding:
  icon: eye
  color: purple

inputs:
  pytest-args:
    description: >-
      Arguments for `pytest --argus`, the default mode. Every LangGraph run your
      tests make is recorded and graded; a test whose run was not clean fails.
    required: false
    default: ""
  run-id:
    description: >-
      Grade this saved run with `argus check <run-id>` instead of running pytest.
      Falls back to the ARGUS_RUN_ID environment variable. Never `last`: in CI the
      newest run file can be a leftover or another job's.
    required: false
    default: ""
  strict:
    description: >-
      `argus check` mode only. `critical_only` (default), or `warn_as_fail` to also
      fail on warning-severity tool failures such as an HTTP 429.
    required: false
    default: critical_only
  install:
    description: >-
      Install argus-agents from PyPI first. Set to "false" when your own
      requirements already install it.
    required: false
    default: "true"
  version:
    description: Version specifier for argus-agents, e.g. "==0.12.0". Empty installs the latest release.
    required: false
    default: ""
  working-directory:
    description: Directory to run in, the project root that holds `.argus/`.
    required: false
    default: "."
  upload-runs:
    description: >-
      On failure, upload the failed runs as an `argus-runs-*` artifact. The files hold
      raw recorded state (inputs, outputs, tool I/O); set to "false" if that must not
      leave the runner.
    required: false
    default: "true"
  cloud:
    description: >-
      Send this job's run cards to a team workspace, and let its policy decide red or
      green. Runs `argus cloud pull-baselines` (what the workspace learned from main),
      then `pytest --argus-report-only` (every run is still recorded and graded, but no
      test fails because of one), with telemetry off for that step, then
      `argus cloud upload --final`. The job fails only if a test fails for its own reasons,
      or the pull or the upload fails. Needs `cloud-url`, and `permissions: id-token: write` on the
      job, which is how it proves who it is: there is no secret to store. Only the card
      leaves the runner: the verdict, the findings and the shape of the data, never a
      value (docs/DATA.md). Applies to the pytest mode, not to `run-id`.
    required: false
    default: "false"
  cloud-url:
    description: >-
      The team workspace to upload to (sets ARGUS_CLOUD_URL). Required when `cloud` is
      "true". The job also needs `permissions: id-token: write`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install argus-agents
      if: inputs.install == 'true'
      shell: bash
      env:
        ARGUS_SPEC: argus-agents${{ inputs.version }}
      run: python -m pip install --quiet "$ARGUS_SPEC"

    - name: ARGUS gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_PYTEST_ARGS: ${{ inputs.pytest-args }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_CLOUD: ${{ inputs.cloud }}
        INPUT_CLOUD_URL: ${{ inputs.cloud-url }}
      run: |
        set -uo pipefail
        if [ "$INPUT_CLOUD" = "true" ]; then
          if [ -z "$INPUT_CLOUD_URL" ]; then
            echo '::error::cloud-url is required when cloud is "true".'
            exit 2
          fi
          if [ -n "$INPUT_RUN_ID" ]; then
            echo '::error::cloud: "true" reports the pytest session; it cannot be combined with run-id.'
            exit 2
          fi
          export ARGUS_CLOUD_URL="$INPUT_CLOUD_URL"
          # A run reported to a team workspace is not also sent as telemetry (docs/DATA.md).
          export ARGUS_TELEMETRY=0
          # Cloud mode grades the pytest session, never one saved run.
          unset ARGUS_RUN_ID
        fi
        marker="$RUNNER_TEMP/argus-marker-$$"
        touch "$marker"
        # Where argus really writes: the nearest project root above us, or $ARGUS_DIR.
        runs=$(python -c "from argus.storage import runs_dir; print(runs_dir())" 2>/dev/null \
          || echo .argus/runs)
        run_id="${INPUT_RUN_ID:-${ARGUS_RUN_ID:-}}"
        rc=0
        strict=""  # pytest --argus does not take --strict; only grade the summary with it here
        if [ -n "$run_id" ]; then
          argus check "$run_id" --strict "$INPUT_STRICT" || rc=$?
          run_ids="$run_id"
          strict="$INPUT_STRICT"
        else
          # Unquoted on purpose: pytest-args is a list of arguments.
          if [ "$INPUT_CLOUD" = "true" ]; then
            # What main learned (.argus/baselines/), so a regression is graded as one. A failed
            # pull fails the job, but the tests still run and the workspace still hears from it.
            if ! argus cloud pull-baselines; then
              echo "::error::ARGUS could not pull the team workspace's baselines (see above)."
              rc=1
            fi
            # Record and grade as usual; the workspace's policy decides red or green.
            python -m pytest --argus-report-only $INPUT_PYTEST_ARGS || rc=$?
          else
            python -m pytest --argus $INPUT_PYTEST_ARGS || rc=$?
          fi
          # The runs this step recorded, not a leftover from an earlier step.
          run_ids=$(find "$runs" -name '*.json' -newer "$marker" 2>/dev/null \
            | xargs -r -n1 basename | sed 's/\.json$//' | sort)
          if [ "$INPUT_CLOUD" = "true" ]; then
            # The job fails for its tests' own reasons, or if the upload does not happen.
            upload_rc=0
            argus cloud upload --final || upload_rc=$?
            if [ "$upload_rc" -ne 0 ]; then
              echo "::error::ARGUS could not report this job's runs to the team workspace (see above)."
              if [ "$rc" -eq 0 ]; then rc=$upload_rc; fi
            fi
          fi
        fi

        # The verdict on the PR page, and the failed runs copied into the bundle
        # (the runner's .argus/ is gone when the job ends). Never changes the outcome.
        suffix=$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')
        bundle="$RUNNER_TEMP/argus-runs-$suffix"
        GATE_STRICT="$strict" ARGUS_BUNDLE="$bundle" python "$GITHUB_ACTION_PATH/summary.py" $run_ids || true
        {
          echo "rc=$rc"
          echo "bundle=$bundle"
          # Random, not $$: matrix legs share $GITHUB_JOB, and a duplicate name fails the upload.
          echo "artifact=argus-runs-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT-$suffix"
        } >> "$GITHUB_OUTPUT"

    - name: Upload ARGUS runs
      if: steps.gate.outputs.rc != '0' && inputs.upload-runs == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.gate.outputs.artifact }}
        path: ${{ steps.gate.outputs.bundle }}
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 14

    - name: Fail if ARGUS failed
      if: steps.gate.outputs.rc != '0'
      shell: bash
      run: exit ${{ steps.gate.outputs.rc }}
